services:
  - type: web
    name: quantum-portfolio-backend
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install uv && uv pip install -r requirements.txt
    startCommand: python -m uvicorn qportfolio.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PYTHONUTF8
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
